name: Feature request / 機能提案
description: 学習用サンプルの改善を提案する
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: テスト方法 / Testing approach
      description: どのFeature / Unitテストで示せるかを書いてください。
  - type: checkboxes
    id: checks
    attributes:
      label: 確認 / Checklist
      options:
        - label: 既存Issueを検索しました / I searched existing issues
          required: true
        - label: 行動規範に同意します / I agree to follow the Code of Conduct
          required: true
